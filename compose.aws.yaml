name: dengue-dashboard

services:
  api:
    image: ${DENGUE_API_IMAGE:?Define DENGUE_API_IMAGE}
    restart: unless-stopped

  frontend:
    image: ${DENGUE_FRONTEND_IMAGE:?Define DENGUE_FRONTEND_IMAGE}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DENGUE_FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
